spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library_db
    username: root
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

file:
  upload-dir: uploads/dev
  expiration-days: 1
  cleanup:
    interval: 60000

async:
  notification:
    core-pool-size: 2
    max-pool-size: 5
    queue-capacity: 100