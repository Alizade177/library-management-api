spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library_db
    username: root
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

file:
  upload-dir: /var/lib/libraryapi/uploads
  expiration-days: 7
  cleanup:
    interval: 86400000

async:
  notification:
    core-pool-size: 5
    max-pool-size: 20
    queue-capacity: 500