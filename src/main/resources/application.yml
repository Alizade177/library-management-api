spring:
  application:
    name: libraryapi
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/library_db
    username: root
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 1h

file:
  upload-dir: uploads
  max-size: 5242880
  expiration-days: 7
  cleanup:
    interval: 86400000

async:
  notification:
    core-pool-size: 2
    max-pool-size: 5
    queue-capacity: 100

